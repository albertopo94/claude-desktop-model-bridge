[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-browser-gateway"
version = "0.1.0"
description = "Local gateway exposing the Claude chat model through a browser session on claude.ai"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Albert" }]
keywords = ["claude", "browser-automation", "gateway", "playwright", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "playwright>=1.48",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "httpx>=0.28",
    "tenacity>=9.0",
]

[project.scripts]
claude-browser-gateway = "claude_browser_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "B", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"